<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Se mitt, Barbies, CV här!" />
    <title>CV - Grupp 27 Projektuppgift</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="../images/favicon.ico" type="x-icon" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Hoppa till innehåll!</a>

    <header class="header">
      <!--Huvudmeny-->
      <nav class="nav" aria-label="Huvudmeny">
        <ul class="nav__list">
          <li class="nav__item">
            <a class="nav__link" href="../index-grupp27.html">Hem</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="about-grupp27.html">Om mig</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="competencies-grupp27.html"
              >Kompetenser</a
            >
          </li>
          <li class="nav__item">
            <a class="nav__link" href="projects-grupp27.html">Projekt</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="education-grupp27.html">Utbildning</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="contact-grupp27.html">Kontakt</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="main" id="main">
      <h1 class="main__title">Mitt CV</h1>
      <button
        class="main__button"
        type="button"
        data-js-action="print-resume"
        data-js-target="resume-content"
      >
        Skriv ut CV
      </button>
      <!-- Ej kodat i JS, ska skriva ut nedan info genom PDF -->

      <!-- Jobblista -->
      <section class="resume__section" aria-labelledby="experience-heading">
        <h2 class="resume__heading" id="experience-heading">Erfarenhet</h2>
        <article class="job" data-year="XXXX">
          <h3 class="job__title">JOBBTITEL</h3>
          <p class="job__meta">
            <span class="job__company">FÖRETAG</span>,
            <time class="job__date" datetime="XXXX">XXXX</time>
          </p>
          <ul class="job__tasks">
            <li class="job__task">ARBETSUPPGIFT_X</li>
          </ul>
        </article>
      </section>

      <!-- Utbildnings-lista -->
      <section class="resume__section" aria-labelledby="education-heading">
        <h2 class="resume__heading" id="education-heading">Utbildning</h2>
        <article class="education">
          <h3 class="education__title">PROGRAM_KURS</h3>
          <p class="education__meta">
            <span class="education__school">SKOLA</span>,
            <time class="education__date" datetime="XXXX">XXXX-XXXX</time>
          </p>
        </article>
      </section>

      <!-- Språklista -->
      <section class="resume__section" aria-labelledby="languages-heading">
        <h2 class="resume__heading" id="languages-heading">Språk</h2>
        <dl class="languages">
          <!-- Dictionary list, kan ändras! -->
          <dt class="languages__term">SPRÅK</dt>
          <dd class="languages__desc">NIVÅ</dd>
        </dl>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">
        &copy; 2026 Barbara Millicent Roberts & Grupp 27
      </p>
    </footer>
  </body>
</html>
